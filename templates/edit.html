{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}

{% block content %}
<div class="card wide">
    <h2>Edit Entry</h2>

    <form method="post">
        <textarea name="text" rows="8" required>{{ entry["content"] }}</textarea>
        <button type="submit">Update</button>
    </form>

    <a href="{{ url_for('diary.index') }}">← Back</a>
</div>
{% endblock %}
